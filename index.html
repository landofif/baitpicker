<!doctype html><html lang="en"><head><meta charset="utf-8"><title>bait picker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="sheet.css?v=7"></head><body>
<div class="wrap">
<nav><a href="index.html" aria-current=page>Bait picker</a><a href="stats.html">Luck, scale, prospect</a><a href="baitchance.html">Bait chance</a><a href="petluck.html">Pet luck</a></nav>
<h1>Bait Picker <span class="hint">FishOnMC bait odds</span></h1>

<table class="inputs" aria-label="Inputs">
<tr><th scope="row"><label for="loc">Location</label></th><td><select id="loc"></select></td></tr>
<tr><th scope="row"><label for="luck">Luck</label></th><td><input id="luck" type="number" min="0" max="2500" step="25" inputmode="numeric"></td><td class="hint" style="border:0;padding-left:8px">0 to 2500</td></tr>
<tr><th scope="row"><label for="scale">Scale</label></th><td><input id="scale" type="number" min="0" max="3500" step="25" inputmode="numeric"></td><td class="hint" style="border:0;padding-left:8px">0 to 3500</td></tr>
<tr><th scope="row">Tiers</th><td class="chk">
<label><input class="tier" data-t="C" type="checkbox" checked> Common</label>
<label><input class="tier" data-t="R" type="checkbox" checked> Rare</label>
<label><input class="tier" data-t="E" type="checkbox" checked> Epic</label>
<label><input class="tier" data-t="L" type="checkbox"> Legendary</label>
<label><input class="tier" data-t="M" type="checkbox"> Mythical</label></td></tr>
<tr><th scope="row">Options</th><td class="chk"><label><input id="lures" type="checkbox" checked> Lures</label></td></tr>
</table>

<div class="sec" id="listtitle"></div>
<p class="hint" id="listnote" style="margin:0 0 6px"></p>
<div class="scroll"><table id="list"></table></div>
<button class="more" id="more" hidden></button>

</div>

<script src="data.js?v=1"></script>
<script>
const RN=["Common","Rare","Epic","Legendary","Mythical"], RL=["C","R","E","L","M"];
const TIER={C:0,R:1,E:2,L:3,M:4};
const USES=[["Crankbait (Tiger",30],["Roostertail",20],["Crankbait Bluegill",30],["Spinner Bait Chartreuse",50],["Frog Leopard",30],["Spinnerbait White Shad",50],["Spinner Bait Golden",50],["Frog Rainforest",30],["Glide Bait",50],["Diving Plug",40],["Popper",40],["Bucktail",25],["Jerkbait",30],["Saltwater Spoon",25],["Marlin Lure Blue Green",50],["Marlin Lure",30],["Frog Dark",30],["Spinner Bait Lime",50]];
const uses=n=>{for(const [k,v] of USES) if(n.startsWith(k)) return v;};
const ALIAS={"Spotted Sea Trout":"Spotted Seatrout"};
const $=id=>document.getElementById(id);
const pct=x=>(x*100).toFixed(x>=0.095||x===0?0:1)+"%";
const pct1=x=>(x*100).toFixed(1)+"%";

function odds(l){let p=[55-l*.02,30+l*.002,10+l*.004,4+l*.006,1+l*.008].map(x=>Math.max(0,x));const s=p.reduce((a,b)=>a+b,0);return p.map(x=>x/s);}
function sizeOdds(s){
  let baby,juv,adult;
  if(s<=1052){baby=20-s*.019;juv=40-s*.008;adult=30+s*.008;}
  else if(s<=2222){baby=0;juv=60-s*.027;adult=30+s*.008;}
  else{baby=0;juv=0;adult=90-s*.019;}
  const large=9.98+s*.018, gig=.02+s*.001;
  let a=[baby,juv,adult,large,gig].map(x=>Math.max(0,x)/100);
  const t=a.reduce((x,y)=>x+y,0);return a.map(x=>x/t);
}
const matches=(t,f)=>t==="*"||(t[0]==="@"?f[3]===t.slice(1):(t==="Peacock Bass species"?f[0].includes("Peacock Bass"):(t===f[2]||t===f[0]||ALIAS[t]===f[0])));
function usable(b,loc){const w=loc.water;if(b.water==="F"||b.water==="S")return w==="B"||w===b.water;return b.water===loc.name;}
function pool(b,loc){const cnt=[0,0,0,0,0],names=[[],[],[],[],[]];
  for(const f of loc.fish){if(b.targets.some(t=>matches(t,f))){cnt[f[1]]++;names[f[1]].push(f[0]);}}return {cnt,names};}
function outcome(cnt,lik,luck){
  // zeb (fishonmc staff): the rarity is rolled first, then the likelihood is checked. Pool fish at that rarity are used, else the next lower rarity with one. A roll below the whole pool only reaches higher rarities 'at a much lesser chance' (no number given, so UP=0), else a normal fish of the rolled rarity.
  const UP=0;
  const p=odds(luck),L=lik/100;
  const res=[0,1,2,3,4].map(r=>{for(let q=r;q>=0;q--) if(cnt[q]>0) return q;return null;});
  const low=cnt.findIndex(n=>n>0);
  const fl=[0,0,0,0,0];
  for(let r=0;r<5;r++){
    if(res[r]!==null){fl[res[r]]+=L*p[r];fl[r]+=(1-L)*p[r];}
    else{const q=L*Math.pow(UP,low-r);fl[low]+=q*p[r];fl[r]+=(1-q)*p[r];}
  }
  return {fl,ce:fl.slice()};
}
const poolStr=c=>c.map((n,i)=>n?n+RL[i]:"").filter(Boolean).join(" ")||"-";
let state={quest:"Epic",showAll:false,sort:"rk",dir:1};
const XPCAP=31.62, xpMax=l=>Math.min(XPCAP,21.714+0.2093*l+0.0266*l*l);
const KCAT={Epic:[0.553,1.2],Rare:[1.303,1.2],Adult:[3.665,0.92],Large:[2.675,0.92],Legendary:[0.738,1]};
const modelReq=(q,l)=>KCAT[q]?Math.min(q==="Legendary"?20:1e9,Math.round(KCAT[q][0]*Math.pow(xpMax(l),KCAT[q][1]))):"";
const QUESTS=["Adult","Large","Rare","Epic","Legendary"];
const QX={Rare:1,Epic:2,Legendary:3};

const tiersOn=()=>{const o={};document.querySelectorAll(".tier").forEach(c=>o[c.dataset.t]=c.checked);return o;};
function candidates(loc,luck,X,lures){
  const T=tiersOn();
  const base=odds(luck)[X];const rows=[];
  for(const b of D.baits){
    if(!usable(b,loc)||b.lik===0) continue; if(!lures&&b.kind==="lure") continue; if(!T[b.rar]) continue;
    const {cnt,names}=pool(b,loc); if(!cnt.some(n=>n)) continue;
    const o=outcome(cnt,b.lik,luck);
    rows.push({b,cnt,names,fl:o.fl[X],ce:o.ce[X],mid:(o.fl[X]+o.ce[X])/2,base});
  }
  const g=new Map();
  for(const r of rows){const k=[r.cnt.join(),r.b.lik,r.b.rar,r.b.kind].join("|");if(!g.has(k)){r.alts=[];g.set(k,r);}else g.get(k).alts.push(r.b.name);}
  const reps=[...g.values()];
  reps.sort((a,b)=>b.mid-a.mid||TIER[a.b.rar]-TIER[b.b.rar]||a.b.name.localeCompare(b.b.name));
  return reps;
}

// typed number: out of range or empty shows red, the calculation uses the clamped value
function readNum(id){
  const el=$(id),lo=+el.min,hi=+el.max,raw=el.value.trim(),v=Number(raw);
  const ok=raw!==""&&isFinite(v)&&v>=lo&&v<=hi;
  el.classList.toggle("bad",!ok);
  return Math.min(hi,Math.max(lo,isFinite(v)&&raw!==""?v:lo));
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLS=[["rk","#",1],["name","Bait",0],["quest","Quest",0],["tier","Tier",0],["lik","Lik %",1],["pool","Pool",0],["odds","Odds",1],["up","+ pts",1],["casts","Casts",1],["fish","Fish",0]];

function saveHash(){
  const p=new URLSearchParams({loc:$("loc").value,luck:$("luck").value,scale:$("scale").value,
    tiers:RL.filter(t=>document.querySelector(`.tier[data-t=${t}]`).checked).join(""),lures:$("lures").checked?1:0,quest:state.quest});
  try{history.replaceState(null,"","#"+p);}catch(e){}
}
function loadHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  if(p.has("loc")&&D.locs.some(l=>l.name===p.get("loc"))) $("loc").value=p.get("loc");
  if(p.has("luck")) $("luck").value=p.get("luck");
  if(p.has("scale")) $("scale").value=p.get("scale");
  if(p.has("tiers")) document.querySelectorAll(".tier").forEach(c=>c.checked=p.get("tiers").includes(c.dataset.t));
  if(p.has("lures")) $("lures").checked=p.get("lures")==="1";
  if(QUESTS.includes(p.get("quest"))) state.quest=p.get("quest");
}

function render(){
  const loc=D.locs.find(l=>l.name===$("loc").value);
  if(!loc||$("luck").value.trim()===""){
    $("listtitle").textContent="";$("listnote").textContent="Pick a location and enter luck.";$("list").innerHTML="";$("more").hidden=true;
    if($("luck").value.trim()==="")$("luck").classList.remove("bad");saveHash();return;}
  const luck=readNum("luck"); readNum("scale");
  const lures=$("lures").checked, ro=odds(luck);
  const all=[];
  for(const q of ["Rare","Epic","Legendary"]){
    const X=QX[q], need=modelReq(q,15), base=ro[X];
    for(const r of candidates(loc,luck,X,lures)){
      if(r.mid-base<.03) continue;
      all.push({r,q,X,name:r.b.name,tier:TIER[r.b.rar],lik:r.b.lik,pool:poolStr(r.cnt),odds:r.mid,up:r.mid-base,casts:need/r.mid,
        fish:RL.map((t,k)=>r.names[k].length?t+": "+r.names[k].join(", "):"").filter(Boolean).join(" · ")+(r.alts.length?" · same: "+r.alts.join(", "):"")});
    }
  }
  all.sort((a,b)=>a.casts-b.casts||a.name.localeCompare(b.name));
  all.forEach((x,i)=>x.rk=i+1);
  $("listtitle").textContent="Bait strategies, fastest quest first";
  $("listnote").textContent=`No bait: Rare ${pct1(ro[1])}, Epic ${pct1(ro[2])}, Legendary ${pct1(ro[3])}. Casts = needed fish / odds. Hidden: under +3 pts. Click a header to sort.`;
  const rows=all.slice().sort((a,b)=>{const x=a[state.sort],y=b[state.sort];return (typeof x==="string"?x.localeCompare(y):x-y)*state.dir||a.rk-b.rk;});
  const lim=state.showAll?rows.length:12, L=$("list"), more=$("more");
  L.innerHTML=`<thead><tr>`+COLS.map(([k,t,n])=>`<th class="s${n?" n":""}" data-k="${k}" tabindex="0"${state.sort===k?` aria-sort="${state.dir>0?"ascending":"descending"}"`:""}>${t}</th>`).join("")+`</tr></thead><tbody>`+
    (rows.slice(0,lim).map(x=>{const r=x.r,rng=Math.abs(r.ce-r.fl)>.005;
      return `<tr><td class="n">${x.rk}</td><td>${esc(x.name)}${r.b.kind==="lure"?` <span class="hint">lure x${uses(x.name)}</span>`:""}</td><td>${x.q}</td><td>${RL[x.tier]}</td><td class="n">${x.lik}</td><td class="n">${x.pool}</td><td class="n">${rng?pct(r.fl)+" to "+pct(r.ce):pct(r.fl)}</td><td class="n">+${(x.up*100).toFixed(0)}</td><td class="n">${Math.round(x.casts)}</td><td class="fish">${esc(x.fish)}</td></tr>`;}).join("")||`<tr><td colspan="10" class="hint">Nothing beats base odds</td></tr>`)+`</tbody>`;
  L.querySelectorAll("th.s").forEach(h=>{
    const go=()=>{const k=h.dataset.k;if(state.sort===k)state.dir=-state.dir;else{state.sort=k;state.dir=(k==="name"||k==="tier"||k==="pool"||k==="rk"||k==="quest"||k==="casts")?1:-1;}render();};
    h.onclick=go;h.onkeydown=e=>{if(e.key==="Enter")go();};});
  if(rows.length>12){more.hidden=false;more.textContent=state.showAll?"Top 12":`All ${rows.length}`;more.onclick=()=>{state.showAll=!state.showAll;render();};}else more.hidden=true;
  saveHash();
}
$("loc").innerHTML='<option value="">choose a location</option>'+D.locs.map(l=>`<option value="${esc(l.name)}">${esc(l.name)} (${l.level})</option>`).join("");
loadHash();
document.querySelectorAll(".tier").forEach(c=>c.addEventListener("input",()=>{state.showAll=false;render();}));
for(const id of ["loc","luck","scale","lures"]) $(id).addEventListener("input",()=>{state.showAll=false;render();});
render();
</script>
</body></html>
