function odds(l){let p=[55-l*.02,30+l*.002,10+l*.004,4+l*.006,1+l*.008].map(x=>Math.max(0,x));const s=p.reduce((a,b)=>a+b,0);return p.map(x=>x/s);}
function sizeOdds(s){
  let baby,juv,adult;
  if(s<=1052){baby=20-s*.019;juv=40-s*.008;adult=30+s*.008;}
  else if(s<=2222){baby=0;juv=60-s*.027;adult=30+s*.008;}
  else{baby=0;juv=0;adult=90-s*.019;}
  const large=9.98+s*.018, gig=.02+s*.001;
  let a=[baby,juv,adult,large,gig].map(x=>Math.max(0,x)/100);
  const t=a.reduce((x,y)=>x+y,0);return a.map(x=>x/t);
}
const matches=(t,f)=>t==="*"||(t[0]==="@"?f[3]===t.slice(1):(t==="Peacock Bass species"?f[0].includes("Peacock Bass"):(t===f[2]||t===f[0]||ALIAS[t]===f[0])));
function usable(b,loc){const w=loc.water;if(b.water==="F"||b.water==="S")return w==="B"||w===b.water;return b.water===loc.name;}
function pool(b,loc){const cnt=[0,0,0,0,0],names=[[],[],[],[],[]];
  for(const f of loc.fish){if(b.targets.some(t=>matches(t,f))){cnt[f[1]]++;names[f[1]].push(f[0]);}}return {cnt,names};}
function outcome(cnt,lik,luck){
  // zeb (fishonmc staff): the rarity is rolled first, then the likelihood is checked. Pool fish at that rarity are used, else the next lower rarity with one. A roll below the whole pool only reaches higher rarities 'at a much lesser chance' (no number given, so UP=0), else a normal fish of the rolled rarity.
  const UP=0;
  const p=odds(luck),L=lik/100;
  const res=[0,1,2,3,4].map(r=>{for(let q=r;q>=0;q--) if(cnt[q]>0) return q;return null;});
  const low=cnt.findIndex(n=>n>0);
  const fl=[0,0,0,0,0];
  for(let r=0;r<5;r++){
    if(res[r]!==null){fl[res[r]]+=L*p[r];fl[r]+=(1-L)*p[r];}
    else{const q=L*Math.pow(UP,low-r);fl[low]+=q*p[r];fl[r]+=(1-q)*p[r];}
  }
  return {fl,ce:fl.slice()};
}

const tiersOn=()=>{const o={};document.querySelectorAll(".tier").forEach(c=>o[c.dataset.t]=c.checked);return o;};
function candidates(loc,luck,X,lures){
  const T=tiersOn();
  const base=odds(luck)[X];const rows=[];
  for(const b of D.baits){
    if(!usable(b,loc)||b.lik===0) continue; if(!lures&&b.kind==="lure") continue; if(!T[b.rar]) continue;
    const {cnt,names}=pool(b,loc); if(!cnt.some(n=>n)) continue;
    const o=outcome(cnt,b.lik,luck);
    rows.push({b,cnt,names,fl:o.fl[X],ce:o.ce[X],mid:(o.fl[X]+o.ce[X])/2,base});
  }
  const g=new Map();
  for(const r of rows){const k=[r.cnt.join(),r.b.lik,r.b.rar,r.b.kind].join("|");if(!g.has(k)){r.alts=[];g.set(k,r);}else g.get(k).alts.push(r.b.name);}
  const reps=[...g.values()];
  reps.sort((a,b)=>b.mid-a.mid||TIER[a.b.rar]-TIER[b.b.rar]||a.b.name.localeCompare(b.b.name));
  return reps;
}

// typed number: out of range or empty shows red, the calculation uses the clamped value
function readNum(id){
  const el=$(id),lo=+el.min,hi=+el.max,raw=el.value.trim(),v=Number(raw);
  const ok=raw!==""&&isFinite(v)&&v>=lo&&v<=hi;
  el.classList.toggle("bad",!ok);
  return Math.min(hi,Math.max(lo,isFinite(v)&&raw!==""?v:lo));
}

  const loc=D.locs.find(l=>l.name===$("loc").value), luck=readNum("luck"), scale=readNum("scale");
  const lures=$("lures").checked;
  const lvl=15;
  const req={};for(const q of QUESTS) req[q]=modelReq(q,lvl);
  const so=sizeOdds(scale), ro=odds(luck);
  const adult=so[2], large=so[3];

  const best={};
  for(const q of ["Rare","Epic","Legendary"]){const c=candidates(loc,luck,QX[q],lures);const base=ro[QX[q]];
    best[q]=c.length&&c[0].mid>base+.0005?{val:c[0].mid,name:c[0].b.name}:{val:base,name:"no bait beats the base odds"};}
  const vals={Adult:adult,Large:large,Rare:best.Rare.val,Epic:best.Epic.val,Legendary:best.Legendary.val};
  const casts={};for(const q of QUESTS) casts[q]=req[q]/vals[q];
  const known=QUESTS.filter(q=>isFinite(casts[q])&&vals[q]>0);
  const top=known.length?known.reduce((a,b)=>casts[b]<casts[a]?b:a):Object.keys(vals).reduce((a,b)=>vals[b]>vals[a]?b:a);

  const how=(top==="Adult"||top==="Large")?"no bait":best[top].name;
  $("verdict").innerHTML=`Fastest quest at ${esc(loc.name)}: <strong>${top}</strong> (${esc(how)}, ${pct(vals[top])} per cast)`;

  $("cmp").innerHTML=`<thead><tr><th>Quest</th><th class="n">Needed</th><th class="n">Per cast</th><th class="n">Casts</th><th>Bait</th></tr></thead><tbody>`+
    QUESTS.map(q=>`<tr data-q="${q}" tabindex="0" aria-selected="${q===state.quest}"${q===top?' class="top"':""}><td>${q}</td><td class="n">${req[q]}</td><td class="n">${pct(vals[q])}</td><td class="n">${isFinite(casts[q])?Math.round(casts[q]):"-"}</td><td>${q==="Adult"||q==="Large"?"any bait":esc(best[q].name)}</td></tr>`).join("")+`</tbody>`;
  document.querySelectorAll("#cmp tbody tr").forEach(r=>{
    const pick=()=>{state.quest=r.dataset.q;state.showAll=false;render();};
    r.onclick=pick;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}};});

  const q=state.quest;
  $("listtitle").textContent=q;
  const L=$("list"), more=$("more");
  if(q==="Adult"||q==="Large"){
    $("listnote").textContent=`No bait effect on size. ${pct1(q==="Adult"?adult:large)} of casts.`;
    L.innerHTML="";more.hidden=true;saveHash();return;
  }
  const X=QX[q], c=candidates(loc,luck,X,lures), base=ro[X];
  $("listnote").textContent=`No bait: ${pct1(base)}. Hidden: under +3 pts. Click a header to sort.`;
  const rows=c.filter(r=>r.mid-base>=.03).map((r,i)=>({r,rk:i+1,name:r.b.name,tier:TIER[r.b.rar],lik:r.b.lik,pool:poolStr(r.cnt),odds:r.mid,up:r.mid-base,
    fish:RL.map((t,k)=>r.names[k].length?t+": "+r.names[k].join(", "):"").filter(Boolean).join(" · ")+(r.alts.length?" · same: "+r.alts.join(", "):"")}));
  rows.sort((a,b)=>{const x=a[state.sort],y=b[state.sort];return (typeof x==="string"?x.localeCompare(y):x-y)*state.dir||a.rk-b.rk;});
  const lim=state.showAll?rows.length:12;
  L.innerHTML=`<thead><tr>`+COLS.map(([k,t,n])=>`<th class="s${n?" n":""}" data-k="${k}" tabindex="0"${state.sort===k?` aria-sort="${state.dir>0?"ascending":"descending"}"`:""}>${t}</th>`).join("")+`</tr></thead><tbody>`+
    (rows.slice(0,lim).map(({r,rk,name,tier,lik,pool,odds,up,fish})=>{const rng=Math.abs(r.ce-r.fl)>.005;
      return `<tr><td class="n">${rk}</td><td>${esc(name)}${r.b.kind==="lure"?` <span class="hint">lure x${uses(name)}</span>`:""}</td><td>${RL[tier]}</td><td class="n">${lik}</td><td class="n">${pool}</td><td class="n">${rng?pct(r.fl)+" to "+pct(r.ce):pct(r.fl)}</td><td class="n">+${(up*100).toFixed(0)}</td><td class="fish">${esc(fish)}</td></tr>`;}).join("")||`<tr><td colspan="8" class="hint">Nothing beats base odds</td></tr>`)+`</tbody>`;
  L.querySelectorAll("th.s").forEach(h=>{
    const go=()=>{const k=h.dataset.k;if(state.sort===k)state.dir=-state.dir;else{state.sort=k;state.dir=(k==="name"||k==="tier"||k==="pool"||k==="rk")?1:-1;}render();};
    h.onclick=go;h.onkeydown=e=>{if(e.key==="Enter")go();};});
  if(rows.length>12){more.hidden=false;more.textContent=state.showAll?"Top 12":`All ${rows.length}`;more.onclick=()=>{state.showAll=!state.showAll;render();};}else more.hidden=true;
  saveHash();
}
$("loc").innerHTML=D.locs.map(l=>`<option value="${esc(l.name)}">${esc(l.name)} (${l.level})</option>`).join("");
$("loc").value="Hawaii";
loadHash();
document.querySelectorAll(".tier").forEach(c=>c.addEventListener("input",()=>{state.showAll=false;render();}));
for(const id of ["loc","luck","scale","lures"]) $(id).addEventListener("input",()=>{state.showAll=false;render();});
render();
</script>
</body></html>
