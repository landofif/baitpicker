<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Prospect</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="sheet.css"></head><body>
<div class="wrap">
<h1>Prospect <span class="hint">FishOnMC shard chance</span></h1>
<table class="inputs" aria-label="Inputs">
<tr><th scope="row"><label for="pr">Prospect</label></th><td><input id="pr" type="number" min="0" max="20000" step="25" value="0" inputmode="numeric"></td><td class="hint">0 to 20000</td></tr>
</table>
<div class="scroll"><table id="res"></table></div>
<div class="sec">Reference</div>
<div class="scroll"><table id="ref"></table></div>
<p class="foot">Source: FishOnMC wiki, Fishing Stats. Shard chance = 1 / (50 / (1 + prospect x 0.0008)), so the base is 1 in 50.</p>
</div>
<script src="sheet.js"></script>
<script>

const ch=p=>(1+p*0.0008)/50;
function render(){
  const p=readNum("pr");
  $("res").innerHTML=table([["Prospect",1],["Shard chance",1],["Per cast",1],["Times base",1]],[[p,pc(ch(p)),one(ch(p)),fix(ch(p)*50)+"x"]]);
  $("ref").innerHTML=table([["Prospect",1],["Shard chance",1],["Per cast",1],["Times base",1]],[0,100,250,500,750,1000,1500,2000,3000,5000].map(q=>[q,pc(ch(q)),one(ch(q)),fix(ch(q)*50)+"x"]));
}
bind(["pr"],render);
</script>
</body></html>
