<!doctype html><html lang="en"><head><meta charset="utf-8"><title>pet luck</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="sheet.css?v=6"></head><body>
<div class="wrap">
<h1>Pet Luck <span class="hint">fill in to see pet catch odds</span></h1>
<table class="inputs" aria-label="Inputs">
<tr><th scope="row"><label for="pl">Pet luck %</label></th><td><input id="pl" type="number" min="0" max="1000" step="5" inputmode="numeric"></td><td class="hint">0 to 1000, in percent</td></tr>
</table>
<div id="o-pl" hidden><div class="scroll"><table id="res"></table></div></div>
</div>
<script src="sheet.js?v=3"></script>
<script>
const RN=["Common","Rare","Epic","Legendary","Mythical"],N=[750,4000,10000,30000,80000];
const ch=(i,p)=>(1+p/100)/N[i];
function render(){
  const p=readOpt("pl");
  $("o-pl").hidden=p===null;
  if(p!==null)$("res").innerHTML=table([["Pet rarity"],["Chance",1],["Per cast",1]],RN.map((n,i)=>[n,pc(ch(i,p),4),one(ch(i,p))]));
}
bind(["pl"],render);
</script>
</body></html>
